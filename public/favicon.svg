<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="100" height="100" fill="#1a1a1a"/>
  
  <!-- Code brackets with gradient -->
  <g fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="3">
    <!-- Left bracket -->
    <path d="M25 30 L15 30 L15 70 L25 70" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right bracket -->
    <path d="M75 30 L85 30 L85 70 L75 70" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter M -->
    <path d="M35 70 L35 30 L45 50 L55 30 L65 30 L65 70 M35 30 L45 50 L55 30" 
          fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>